# Python data and training code for the neural demosaic model (epic #115).
# Not part of the Cargo workspace; run everything through `uv run` from this folder.
[project]
name = "rohditor-ml"
version = "0.1.0"
description = "Dataset curation and training code for Rohditor's neural demosaic model"
requires-python = ">=3.11,<3.14"
# The download scripts use only the standard library. Decoding and training
# dependencies are added by the tasks that need them.
dependencies = [
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "rawpy>=0.28.0",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = ["pytest>=8"]
# Training, export and evaluation. Install inside the `rocm` distrobox with its own
# environment (the home directory is shared with the host):
#   UV_PROJECT_ENVIRONMENT=.venv-rocm uv sync --group train
# Known good: PyTorch 2.14.1+rocm7.2 (self-contained wheel) in a ROCm 10.0.0 container
# on an RX 9070 XT (gfx1201).
train = [
    "torch>=2.14",
    "triton-rocm>=3.8",  # listed so it resolves from the PyTorch index below
    "onnx>=1.19",
    "onnxruntime>=1.23",
    "onnxscript>=0.5",
    "pyyaml>=6",
    "tensorboard>=2.20",
]

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rohditor_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
