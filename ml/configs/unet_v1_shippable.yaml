# Shipped with Rohditor: CC0 and CC BY 4.0 sources only (PixelShift200, raw.pixls.us,
# the CC0 part of RawNIND).
base: unet_v1_base.yaml
variant: shippable
licenses: [CC0-1.0, CC-BY-4.0]

# Stage 1 is identical to `full`. Stage 2 only has the CC0 RawNIND pairs (~1.7k
# train patches against ~10.7k for `full`), so it is shorter and mixes in fewer
# of them; the base schedule would show each of them ~280 times.
stages:
  - name: synthetic
    steps: 300000
    lr: 3.0e-4
    warmup: 2000
    real_fraction: 0.0
  - name: real
    steps: 10000
    lr: 1.0e-4
    warmup: 500
    real_fraction: 0.2
