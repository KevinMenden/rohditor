# Shared defaults of the v1 U-Net (issue #117). The variant configs only add the
# license filter; everything else (model, schedule, evaluation) is the same.
model:
  name: unet_v1
  version: 1
  channels: [32, 64, 128, 256]

data:
  npy_dir: data/npy               # relative to ml/; built by `python -m rohditor_ml.train.store`
  noise_params: data/noise_params.json
  crop: 240                       # from the 256 patches; a multiple of 16, see the contract
  exposure_min: 0.25              # downward-only exposure scale, log-uniform in [min, 1]
  pixelshift_fraction: 0.4        # share of full-resolution pixel-shift truth among clean samples
  limit_patches: null             # cap per index list (pixel-shift, binned, real), for smoke runs
  warm_cache: true                # read the train arrays once up front (random reads from a cold cache starve the GPU)
  workers: 10

train:
  seed: 0
  batch_size: 32
  weight_decay: 1.0e-4
  bf16: true
  grad_clip: 1.0
  log_every: 100
  val_every: 2500
  checkpoint_every: 2500
  val_clean: 384
  val_real: 128

# Stages run in order; each has its own warmup + cosine learning-rate schedule.
# On the RX 9070 XT a step of batch 32 takes ~87 ms (0.9 GB peak), so stage 1 is ~7 h.
stages:
  - name: synthetic               # stage 1: on-the-fly synthetic noise on clean mosaics
    steps: 500000
    lr: 3.0e-4
    warmup: 2000
    real_fraction: 0.0
  - name: real                    # stage 2: fine-tune with real RawNIND pairs mixed in
    steps: 50000
    lr: 1.0e-4
    warmup: 500
    real_fraction: 0.3
