name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review at a time per PR; a new push cancels the stale review.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, and PRs from forks (they don't get access to repository secrets).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write # required by claude-code-action for OIDC auth
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Subscription (Pro/Max) auth; create the token with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md / AGENTS.md first and judge the
            change against those project guidelines. Focus on:
            - Correctness bugs, including edge cases in image-processing math
              (dimension/byte arithmetic, off-by-one, color-space/state mix-ups).
            - Layering: lower crates must not depend on core/gpu/engine/apps, and
              toolkit-specific code belongs only in apps/*.
            - Immutable RAW data, validated/versioned recipes, cancellation, and
              transactional output writes.
            - Missing or weak tests (small asymmetric correctness tests for
              image-processing changes).
            - Maintainability: module structure, overly long files or functions,
              unnecessary complexity.

            Be concise and only raise issues that matter; skip style nits that
            rustfmt/clippy already enforce (CI runs ./scripts/check.sh).
            Leave inline comments on specific lines, then post one short summary
            comment with `gh pr comment`.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
