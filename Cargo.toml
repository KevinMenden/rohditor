[workspace]
members = [
    "apps/cli",
    "apps/desktop",
    "crates/catalog",
    "crates/camera-profile",
    "crates/color",
    "crates/core",
    "crates/detail",
    "crates/demosaic",
    "crates/edit",
    "crates/engine",
    "crates/gainmap",
    "crates/gpu",
    "crates/highlight",
    "crates/image",
    "crates/look",
    "crates/mask",
    "crates/neural",
    "crates/optics",
    "crates/raw",
    "crates/reference",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1.0"
bytemuck = "1.25"
clap = { version = "4.5", features = ["derive"] }
criterion = "=0.5.1"
half = "=2.7.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lensfun = "=0.7.0"
# ONNX Runtime for the neural demosaic. `download-binaries` fetches a prebuilt
# runtime at build time and `copy-dylibs` places it next to the binaries.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-rustls", "api-31", "webgpu"] }
pollster = "=0.4.0"
rayon = "1.11"
rawler = "=0.7.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tiff = { version = "0.11", default-features = false, features = ["deflate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
wgpu = { version = "=29.0.4", default-features = false, features = ["vulkan", "wgsl"] }

# GPUI's wgpu renderer, vendored with local changes (apps/desktop/vendor/gpui_wgpu).
[patch."https://github.com/zed-industries/zed"]
gpui_wgpu = { path = "apps/desktop/vendor/gpui_wgpu" }

# Zed's own registry patches that GPUI's Linux backend relies on.
[patch.crates-io]
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
