[workspace]
members = [
    "apps/cli",
    "apps/desktop",
    "crates/catalog",
    "crates/core",
    "crates/demosaic",
    "crates/edit",
    "crates/gpu",
    "crates/image",
    "crates/raw",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1.0"
bytemuck = "1.25"
clap = { version = "4.5", features = ["derive"] }
criterion = "=0.5.1"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "wgpu", "x11"] }
half = "=2.7.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
pollster = "=0.4.0"
rayon = "1.11"
rawler = "=0.7.2"
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
wgpu = { version = "=27.0.1", default-features = false, features = ["vulkan", "wgsl"] }
winit = "=0.30.13"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
